plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.notepad'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.notepad"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    // Signing:
    //  - By default every build (local or CI) is signed with ci-debug.keystore,
    //    a fixed, NON-SECRET key committed to the repo. Same key every time means
    //    each new APK installs over the old one and your notes are kept.
    //  - Optional: add SIGNING_* repo secrets (see README) to sign releases with
    //    a private key instead.
    def keystorePath = System.getenv("SIGNING_KEYSTORE_PATH")
    signingConfigs {
        debug {
            storeFile file("ci-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
}
